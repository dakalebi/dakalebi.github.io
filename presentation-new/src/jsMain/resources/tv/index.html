<!doctype html>
<!--
  The TV page, which the Android TV app loads. Same bundle as every other page;
  `data-shell="tv"` picks the TV root and the tokens' TV sizes (1rem = 1/60 of the panel).
-->
<html lang="ka" data-shell="tv">
  <head>
    <meta charset="utf-8" />
    <!--
      No zoom, the same as the other pages. A 1080p Android TV WebView reports a device
      pixel ratio of 2, so this page gets about 960x540 CSS pixels: the size the TV
      tokens are designed at.
    -->
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no"
    />
    <title>ჩემი ცოლის დაქალები</title>
    <meta name="theme-color" content="#1d1512" />

    <link rel="icon" href="../favicon.ico" sizes="any" />
    <link rel="apple-touch-icon" sizes="180x180" href="../icon-180.png" />

    <!-- Mersad, declared in tokens.css. Why it is preloaded: see /index.html. -->
    <link rel="preload" href="../fonts/Mersad.ttf" as="font" type="font/ttf" crossorigin />
    <!-- The shared sheets, where the shell differences live in tokens.css, then the TV
         shell's own layout. -->
    <link rel="stylesheet" href="../tokens.css" />
    <link rel="stylesheet" href="../base.css" />
    <link rel="stylesheet" href="../components.css" />
    <link rel="stylesheet" href="../foundations.css" />
    <link rel="stylesheet" href="../gallery.css" />
    <link rel="stylesheet" href="tv.css" />
  </head>
  <body>
    <div id="root"></div>
    <script src="../app.js"></script>
  </body>
</html>
