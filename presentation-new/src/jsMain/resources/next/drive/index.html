<!doctype html>
<!--

-->

      content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover"

    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />

      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..100,400..900&family=Noto+Sans+Georgian:wdth,wght@62.5..100,400..900&display=swap"
