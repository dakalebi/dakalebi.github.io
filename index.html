<!doctype html>
<html lang="ka">
  <head>
    <meta charset="utf-8" />
    <!--
      No zoom, on every page. `user-scalable=no` holds the layout at 1x on
      Android and in Chrome's device emulation. iOS Safari has ignored both it
      and `maximum-scale` since iOS 10, so there a pinch is cancelled in script
      (`ui/PageZoom.kt`), double-tap is `touch-action: manipulation` in CSS, and
      form fields are 16px so focusing one does not yank the viewport in.
    -->
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover"
    />
    <title>ჩემი ცოლის დაქალები — სანახავი დაფა</title>
    <meta
      name="description"
      content="ჩემი ცოლის დაქალები — სერიების სანახავი დაფა ფორმულას ოფიციალური წყაროდან"
    />
    <meta name="theme-color" content="#0d0c11" />
    <meta property="og:title" content="ჩემი ცოლის დაქალები — სანახავი დაფა" />
    <meta property="og:type" content="website" />
    <meta property="og:image" content="https://dakalebi.github.io/icon-512.png" />

    <!--
      The mark is a transparent PNG, so it sits on the black page without a
      plate behind it. `favicon.ico` is here for the clients that request it
      blind at the site root regardless of what these tags say.
    -->
    <link rel="icon" href="favicon.ico" sizes="any" />
    <link rel="icon" type="image/png" sizes="32x32" href="icon-32.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="icon-16.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="icon-180.png" />

    <!--
      Mersad is the face for all text, self-hosted and declared in tokens.css. It
      carries Mtavruli (U+1C90-1CBF), which the uppercase treatment depends on.
      Preloaded because the stylesheet only asks for it once the page is styled,
      and every line of Georgian waits on it. `crossorigin` is required on a font
      preload even from the same origin, or the browser fetches it twice.

      JetBrains Mono is for timecodes and counters only. `display=swap` keeps
      them visible if fonts.gstatic.com is slow or blocked.
    -->
    <link rel="preload" href="fonts/Mersad.ttf" as="font" type="font/ttf" crossorigin />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600&display=swap"
    />
    <!--
      Two links rather than an `@import` chain, which would cost a serialised
      round trip before first paint. Order matters throughout: tokens first,
      then this app's own palette for them, then keel's page-level rules and
      component styles, then this app's own tokens and stylesheet last - so a
      selector of equal specificity anywhere above (`body`, `.spinner`, ...) is
      always the one this app wrote, not keel's.
    -->
    <link rel="stylesheet" href="keel/tokens.css" />
    <link rel="stylesheet" href="keel-theme.css" />
    <link rel="stylesheet" href="keel/base.css" />
    <link rel="stylesheet" href="keel/components.css" />
    <link rel="stylesheet" href="tokens.css" />
    <link rel="stylesheet" href="web.css" />
  </head>
  <body>
    <div id="root"></div>
    <script src="app.js"></script>
  </body>
</html>
