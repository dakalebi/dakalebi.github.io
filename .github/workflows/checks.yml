name: Checks

# Everything except master and redesign/develop. Pushes to those are covered by their
# deploy workflows (deploy.yml, redesign.yml), which run the same guard against the
# same build before they publish anything.
#
# A pull request from this repository also gets its own copy of the site at
# /pr/<number>/, rebuilt on every push and removed when the pull request closes.
# Pull requests from forks get the check only: their token cannot write the site,
# and they skip the preview jobs rather than fail them.
on:
  push:
    branches-ignore: [master, redesign/develop]
  pull_request:
    types: [opened, synchronize, reopened, closed]
  workflow_dispatch:

# The ceiling for the publish workflow's jobs, which ask for what they need. The
# check itself only reads.
permissions:
  contents: write
  pages: write
  id-token: write

# One run per branch or pull request. A newer push makes an older run's answer,
# and its preview, irrelevant, and closing a pull request cancels a preview still
# on its way.
concurrency:
  group: checks-${{ github.ref }}
  cancel-in-progress: true

jobs:
  css-classes:
    if: github.event.action != 'closed'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"

      - uses: gradle/actions/setup-gradle@v4

      # The guard reads the *built* stylesheets: `:presentation-new`'s sheets only
      # reach the output through `jsProcessResources`, and the check is about what
      # each shell's page actually links.
      - name: Build Kotlin/JS bundle
        run: ./gradlew jsBrowserDistribution

      - name: Every emitted CSS class is styleable on the shell that draws it
        run: python3 tools/check-css-classes.py

      - name: Keep the build for the preview
        if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
        uses: actions/upload-artifact@v7
        with:
          name: site-build
          path: build/dist/js/productionExecutable
          if-no-files-found: error
          retention-days: 1

  # Every module's unit tests, on Node. `allTests` rather than one module's task, so
  # a module added or removed by a refactor is covered without editing this file.
  # Its own job, beside css-classes rather than inside it: the two answer different
  # questions, a failure names which one broke, and the preview does not wait for it.
  unit-tests:
    if: github.event.action != 'closed'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"

      - uses: gradle/actions/setup-gradle@v4

      - name: Unit tests
        run: ./gradlew allTests

  preview:
    needs: css-classes
    if: github.event_name == 'pull_request' && github.event.action != 'closed' && github.event.pull_request.head.repo.full_name == github.repository
    uses: ./.github/workflows/publish.yml
    with:
      folder: pr/${{ github.event.pull_request.number }}
      artifact: site-build

  remove-preview:
    if: github.event_name == 'pull_request' && github.event.action == 'closed' && github.event.pull_request.head.repo.full_name == github.repository
    uses: ./.github/workflows/publish.yml
    with:
      folder: pr/${{ github.event.pull_request.number }}
