name: Deploy to GitHub Pages

# The site is assembled from two branches into one Pages artifact:
#   /          the live app, built from `main` (Compose HTML / Kotlin-JS)
#   /preview   the 2.0 app, built from `preview` (Compose Multiplatform / wasmJs)
# Both are rebuilt on every deploy, because a Pages deploy replaces the whole site —
# so building only one branch's output would wipe the other's. Pushing to either
# branch therefore refreshes the complete, consistent site.
on:
  push:
    branches: [main, preview]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Never run two deploys at once; always let the newest push win.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out main (the live root app)
        uses: actions/checkout@v5
        with:
          ref: main
          path: main

      - name: Check out preview (the /preview app)
        uses: actions/checkout@v5
        with:
          ref: preview
          path: preview

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"

      - uses: gradle/actions/setup-gradle@v4

      - name: Build the root app (Compose HTML, Kotlin/JS)
        working-directory: main
        run: ./gradlew jsBrowserDistribution

      - name: Build the preview app (Compose Multiplatform, wasmJs)
        working-directory: preview
        run: ./gradlew :web:wasmJsBrowserDistribution

      - name: Assemble the combined site
        run: |
          mkdir -p _site/preview
          cp -R main/build/dist/js/productionExecutable/. _site/
          cp -R preview/web/build/dist/wasmJs/productionExecutable/. _site/preview/
          # GitHub Pages runs Jekyll by default, which drops files beginning with an
          # underscore; Kotlin/JS + webpack can emit those.
          touch _site/.nojekyll

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v4
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
