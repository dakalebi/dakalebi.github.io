name: Deploy to GitHub Pages

# Manual-only until GitHub Pages is enabled for this repo. Once Pages is on
# (Settings -> Pages -> Source: GitHub Actions), uncomment the push trigger so
# every commit to main deploys. Pages on a private repo needs GitHub Pro or
# Team; on the free tier the repo has to be public.
on:
  # push:
  #   branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Never run two deploys at once; always let the newest push win.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"

      - uses: gradle/actions/setup-gradle@v4

      - name: Build Kotlin/JS bundle
        run: ./gradlew jsBrowserDistribution

      # GitHub Pages runs Jekyll by default, which drops files beginning with
      # an underscore. Kotlin/JS + webpack can emit those.
      - name: Disable Jekyll
        run: touch build/dist/js/productionExecutable/.nojekyll

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v4
        with:
          path: build/dist/js/productionExecutable

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
