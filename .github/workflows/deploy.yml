name: Deploy to GitHub Pages

# Three kinds of publisher, one site:
#
#   main          https://dakalebi.github.io/              /tv/  /drive/
#   preview       https://dakalebi.github.io/preview/      /preview/tv/  /preview/drive/
#   pull request  https://dakalebi.github.io/pr/<number>/  (checks.yml)
#
# Each one builds only itself and owns one folder of the site; publish.yml holds
# how a folder is written and how the site is deployed. Rebuilding everything on
# every deploy was tried before and retired in f6eb023: a branch that failed to
# build blocked production too.
#
# Each shell (/tv/, /drive/) is a folder inside the one distribution, so a new
# shell is published with its folder and needs no step of its own.
#
# ------------------------------------------------- what makes the folders work at all --
#
# Two properties of the app, and both need to stay true. Every asset path is
# relative - the TV shell reaches the shared sheets as `../keel/tokens.css`, which
# stays correct under any prefix - so a copy under /preview or /pr/<n> finds its
# own files rather than the root's. And routing is hash-based, so a deep link is
# /preview/#/watch, one real file, which is all Pages can serve without rewrite
# rules.
#
# Note that every folder talks to the SAME Firebase project as production, because
# the config is compiled in. They are staging surfaces for the interface, not
# isolated environments: anything done there is real data.

on:
  push:
    branches: [main, preview]
  workflow_dispatch:

# The ceiling for the publish workflow's jobs, which ask for what they need.
permissions:
  contents: write
  pages: write
  id-token: write

# One run per branch at a time, and queued rather than cancelled, so a branch's
# newest commit is always the last one written. GitHub keeps one waiting run and
# cancels an older waiting one, which is right here: the newer commit replaces it.
concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Only main and preview have a folder
        if: github.ref_name != 'main' && github.ref_name != 'preview'
        run: |
          echo "::error::${GITHUB_REF_NAME} has no folder to publish to. Pull requests publish from checks.yml."
          exit 1

      # keel is a submodule, and `includeBuild("keel")` in settings.gradle.kts
      # points straight at its directory. Without this the checkout leaves that
      # directory empty and Gradle fails at configuration time, before any task
      # runs.
      - name: Check out the branch being published
        uses: actions/checkout@v5
        with:
          submodules: true

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"

      - uses: gradle/actions/setup-gradle@v4

      - name: Build Kotlin/JS bundle
        run: ./gradlew jsBrowserDistribution

      # Blocks the publish rather than only the merge. The bug this guards against
      # - a shared composable emitting classes one shell has no rules for - is
      # invisible in a build log and reaches users as an unstyled screen. It reads
      # the built stylesheets, so it has to follow the build.
      - name: Every emitted CSS class is styleable on the shell that draws it
        run: python3 tools/check-css-classes.py

      # Pages keys a deployment by commit SHA, so a preview branch sitting at the
      # identical commit to main claims main's deployment: the duplicate is
      # accepted, dropped seconds later, and /preview goes on serving whatever was
      # there before. The folder is still written and the next deploy of anything
      # serves it, so this says so rather than failing.
      - name: Warn when preview is main's commit
        if: github.ref_name == 'preview'
        run: |
          if [ "$(git ls-remote origin refs/heads/main | cut -f1)" = "${GITHUB_SHA}" ]; then
            echo "::warning::preview is at the same commit as main, so this deployment is a duplicate and /preview will not change until the next deploy."
          fi

      - uses: actions/upload-artifact@v7
        with:
          name: site-build
          path: build/dist/js/productionExecutable
          if-no-files-found: error
          retention-days: 1

  publish:
    needs: build
    uses: ./.github/workflows/publish.yml
    with:
      folder: ${{ github.ref_name == 'main' && '.' || 'preview' }}
      artifact: site-build
