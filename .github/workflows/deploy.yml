name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Never run two deploys at once; always let the newest push win.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      # keel is a submodule, and `includeBuild("keel")` in settings.gradle.kts points
      # straight at its directory. Without this the checkout leaves that directory
      # empty and Gradle fails at configuration time, before any task runs.
      - uses: actions/checkout@v5
        with:
          submodules: true

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"

      - uses: gradle/actions/setup-gradle@v4

      - name: Build Kotlin/JS bundle
        run: ./gradlew jsBrowserDistribution

      # Blocks the deploy rather than only the merge. The bug this guards against -
      # a shared composable emitting classes one shell has no rules for - is
      # invisible in a build log and reaches users as an unstyled screen.
      - name: Every emitted CSS class is styleable on the shell that draws it
        run: python3 tools/check-css-classes.py

      # GitHub Pages runs Jekyll by default, which drops files beginning with
      # an underscore. Kotlin/JS + webpack can emit those.
      - name: Disable Jekyll
        run: touch build/dist/js/productionExecutable/.nojekyll

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v4
        with:
          path: build/dist/js/productionExecutable

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
