<!doctype html>
<html lang="ka" class="drive">
  <head>
    <meta charset="utf-8" />
    <!--
      Same viewport as the web page: no zoom (see the note there), and
      `viewport-fit=cover` so a phone in landscape uses the whole width and drive.css
      pads the notch itself.
    -->
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover"
    />
    <title>ჩემი ცოლის დაქალები</title>
    <meta name="theme-color" content="#000000" />

    <link rel="icon" href="../favicon.ico" sizes="any" />
    <link rel="apple-touch-icon" sizes="180x180" href="../icon-180.png" />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Noto+Sans+Georgian:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600&display=swap"
    />
    <!--
      The same order as the other two pages, for the same reasons: keel's tokens, this
      app's palette for them, keel's page and component rules, this app's tokens, and
      this page's own sheet last. keel is needed because the sign-in screen is shared
      (`ui/LoginScreen.kt`) and draws keel's `.input` and `.btn`. `web.css` is not
      linked: its phone scale and hover rules are the wrong size for a car.
    -->
    <link rel="stylesheet" href="../keel/tokens.css" />
    <link rel="stylesheet" href="../keel-theme.css" />
    <link rel="stylesheet" href="../keel/base.css" />
    <link rel="stylesheet" href="../keel/components.css" />
    <link rel="stylesheet" href="../tokens.css" />
    <link rel="stylesheet" href="drive.css" />
  </head>
  <body>
    <!--
      `data-shell` is what `ui/Shell.kt` reads to pick the root composable. The bundle
      is the one the web and TV pages load; only the entry point differs.
    -->
    <div id="root" data-shell="drive"></div>
    <script src="../app.js"></script>
  </body>
</html>
